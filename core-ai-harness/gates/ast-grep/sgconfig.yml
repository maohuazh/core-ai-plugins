# AST-Grep Configuration — default profile
# Rule directories (relative to this config file)
# Profile: default → generic FP rules only.
# See sgconfig-fbr.yml for the FBR profile (adds shape rules).
# Note: security rules are implemented by gates/security/pattern_scanner.py
# (regex scanner), not as ast-grep rules.

ruleDirs:
  - rules/fp

# Language configuration
languageGlobs:
  java:
    - "**/*.java"

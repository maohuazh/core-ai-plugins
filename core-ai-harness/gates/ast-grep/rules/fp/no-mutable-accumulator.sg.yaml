id: no-mutable-accumulator
language: java
severity: error
message: |
  Mutable accumulator pattern detected. Use Stream.reduce() or collect() instead.

  Bad:
    List<String> result = new ArrayList<>();
    for (Item item : items) { result.add(item.getName()); }

  Good:
    List<String> result = items.stream()
        .map(Item::getName)
        .collect(Collectors.toList());

  FP Principle: Accumulators should not be constructed by mutation.
  Use reduce or collect instead.

note: "Violates Imperative Red Flags: Accumulators constructed by mutation"

rule:
  # Match `.add()` expression statements that have a loop ancestor.
  # `stopBy: end` is required: with the default `stopBy: neighbor` the search
  # stops at the loop body block and never reaches the for/while statement,
  # so the rule silently matches nothing (as observed with ast-grep 0.45).
  any:
    - all:
        - kind: expression_statement
        - pattern: $VAR.add($$$);
        - inside:
            kind: for_statement
            stopBy: end
    - all:
        - kind: expression_statement
        - pattern: $VAR.add($$$);
        - inside:
            kind: enhanced_for_statement
            stopBy: end
    - all:
        - kind: expression_statement
        - pattern: $VAR.add($$$);
        - inside:
            kind: while_statement
            stopBy: end

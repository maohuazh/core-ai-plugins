id: shape-property-annotation-forbidden-in-domain
language: java
severity: warning
message: |
  @Property DTO annotation should not appear in domain packages.

  Keep domain schema models independent from wire/JSON annotations.

note: "Shape constraint: DTOs live in api/kafka/dto packages, not domain"

rule:
  all:
    - kind: program

    - has:
        kind: annotation
        pattern: "@Property($$$)"

    - has:
        kind: package_declaration
        any:
          - pattern: package $$$.domain;
          - pattern: package $$$.domain.$$$;


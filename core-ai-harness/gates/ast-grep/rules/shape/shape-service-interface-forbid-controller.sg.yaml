id: shape-service-interface-forbid-controller
language: java
severity: warning
message: |
  Service-interface modules must be contracts-only. Controllers must not be declared here.

  Move controllers to the corresponding *-service implementation module.

note: "Shape constraint: *-service-interface contains contracts only"

files:
  - "**/*-service-interface/**"

rule:
  kind: super_interfaces
  pattern:
    context: public class $C implements Controller { $$$ }
    selector: super_interfaces
